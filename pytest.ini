[pytest]
addopts = -ra -v --snapshot-warn-unused
log_cli = true
log_level = DEBUG
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
testpaths = model_serving_tests
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore::DeprecationWarning
markers =
    smoke: Basic model deployment tests
    multigpu: Test case which needs two or more GPUs
    granite4k: Test for new granite RHEL AI model
    phi4k: Test for Phi model
    phi4: Test for Phi 4 model
    deepseekdistill: Test for deepseek-r1-distill-llama-8b
    mistral: Test for Mistral-7B-v0.3 model
    tinyllama: Test for tinyllama-1.1b-chat-v1.0 model
    granite8b: Test for granite-3.1-8b-instruct model
    granite33b: Test for granite-3.3-8b-instruct model
    falcon: Test for Falcon model
    pixtral12b: Test for mistralai/Pixtral-12B-Base-2409 model
    ministral: Test for Ministral models
